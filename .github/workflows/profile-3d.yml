name: Profile 3D assets

on:
  schedule:
    - cron: "0 18 * * *" # daily (23:30 IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hero + 3D contribution SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/build_profile_svgs.py
      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets
          if git commit -m "chore: refresh profile 3D assets"; then
            git push
          fi
