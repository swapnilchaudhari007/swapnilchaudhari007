name: Profile 3D assets

on:
  schedule:
    - cron: "0 18 * * *" # daily (23:30 IST)
  workflow_dispatch:

permissions:
  contents: write

# never let two refreshes race each other on push
concurrency:
  group: profile-3d
  cancel-in-progress: true

jobs:
  build:
    # pinned: ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build hero + 3D contribution SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/build_profile_svgs.py
      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets
          if git commit -m "chore: refresh profile 3D assets"; then
            git push
          fi
